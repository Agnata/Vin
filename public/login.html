<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logga in · Vinkällaren</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="login">
  <a href="/" class="brand" style="font-style:italic;color:var(--muted);text-decoration:none">← vin.parnes.com</a>
  <h1>Logga in</h1>
  <p class="lede">Välkommen tillbaka till källaren.</p>
  <form id="form" novalidate>
    <label class="f">E-post<input id="email" type="email" autocomplete="username" required></label>
    <label class="f">Lösenord<input id="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="submit" type="submit">Logga in</button>
  </form>
</main>
<script src="/js/login.js" type="module"></script>
</body>
</html>
