# /etc/apache2/sites-available/vin.parnes.com.conf
# Kräver: sudo a2enmod proxy proxy_http headers ssl http2 rewrite
# Certifikat: sudo certbot --apache -d vin.parnes.com  (fyller i SSL-raderna nedan)

<VirtualHost *:80>
    ServerName vin.parnes.com
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://vin.parnes.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vin.parnes.com
    Protocols h2 http/1.1

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/ timeout=90
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https"

    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/vin.parnes.com-error.log
    CustomLog ${APACHE_LOG_DIR}/vin.parnes.com-access.log combined

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/vin.parnes.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vin.parnes.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
