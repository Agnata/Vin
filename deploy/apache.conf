# Mall. deploy/install.sh skriver den till /etc/apache2/vinkallaren-proxy.conf, som inkluderas
# i HTTPS-vhosten för @SERVER_NAME@ med:
#   IncludeOptional /etc/apache2/vinkallaren-proxy.conf
# Kräver modulerna proxy, proxy_http och headers. Vhosten har bara ServerName @SERVER_NAME@
# (inga alias), så andra värdnamn hamnar aldrig här.

# All trafik går till Node, som själv sätter CSP, Cache-Control och övriga säkerhetsheaders.
ProxyPreserveHost On
ProxyPass        / http://127.0.0.1:@PORT@/ timeout=90
ProxyPassReverse / http://127.0.0.1:@PORT@/
RequestHeader set X-Forwarded-Proto "https"

Header always set Strict-Transport-Security "max-age=31536000"
