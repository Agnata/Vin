# Mall för port 80. Skapas av deploy/install.sh som /etc/apache2/sites-available/@SERVER_NAME@.conf
# när ingen HTTPS-vhost finns än. certbot --apache --redirect skapar sedan @SERVER_NAME@-le-ssl.conf
# och lägger till omdirigering till HTTPS här.
<VirtualHost *:80>
    ServerName @SERVER_NAME@
    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/@SERVER_NAME@-error.log
    CustomLog ${APACHE_LOG_DIR}/@SERVER_NAME@-access.log combined
</VirtualHost>
